clean_service:
  name: Start deep clean
  description: >-
    Starts a deep clean cycle, powering the Ooler on if it is off. This is the
    ~45 minute cycle you would start from the mobile app, not the unit's own
    hourly water-treatment cycle, which cannot be started or stopped.
  target:
    entity:
      integration: ooler
      domain: climate

get_schedule:
  name: Get schedule
  description: >-
    Return the current device schedule in the same format accepted by
    set_schedule, so you can inspect it or use it as a template.
  target:
    entity:
      integration: ooler

save_schedule:
  name: Save schedule
  description: Save the current device schedule with a name for later use.
  target:
    entity:
      integration: ooler
  fields:
    name:
      name: Name
      description: A name for this schedule (e.g., "weekday", "vacation").
      required: true
      example: "weekday"
      selector:
        text:

delete_schedule:
  name: Delete schedule
  description: Delete a previously saved schedule.
  target:
    entity:
      integration: ooler
  fields:
    name:
      name: Name
      description: The name of the saved schedule to delete.
      required: true
      example: "weekday"
      selector:
        text:

load_schedule:
  name: Load schedule
  description: Write a previously saved schedule to the device.
  target:
    entity:
      integration: ooler
  fields:
    name:
      name: Name
      description: The name of the saved schedule to load.
      required: true
      example: "weekday"
      selector:
        text:

set_schedule:
  name: Set schedule
  description: >-
    Write a schedule directly to the device. Each entry in "nights" defines a
    temperature program that is replicated across the listed days. Use
    "temperature" for a single bedtime temp, or "temps" for multiple mid-night
    temperature changes.
  target:
    entity:
      integration: ooler
  fields:
    nights:
      name: Nights
      description: >-
        List of night definitions. Each has "days" (list of day numbers,
        0=Monday through 6=Sunday), "bedtime", "off_time", and either
        "temperature" (single value) or "temps" (list of {time, temperature}
        for mid-night changes). Optional "warm_wake" with "temperature" and
        "duration".
      required: true
      selector:
        object:
