name: Lint

on:
  push:
    branches:
      - "master"
      - "dev"
      - "quality-scale"
  pull_request:
    branches:
      - "master"

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt

      - name: Lint
        run: python3 -m ruff check .

      - name: Format
        run: python3 -m ruff format . --check

  mypy:
    name: "Mypy"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt

      - name: Install HA component dependencies
        run: |
          python3 -c "
          import json, subprocess, pathlib, importlib.util
          ha = pathlib.Path(importlib.util.find_spec('homeassistant').origin).parent
          for comp in ['bluetooth', 'usb', 'bluetooth_adapters']:
              manifest = ha / 'components' / comp / 'manifest.json'
              if manifest.exists():
                  reqs = json.loads(manifest.read_text()).get('requirements', [])
                  if reqs:
                      subprocess.check_call(['pip', 'install'] + reqs)
          "

      - name: Mypy
        run: python3 -m mypy custom_components/ooler
